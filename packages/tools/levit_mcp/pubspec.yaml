name: levit_mcp
description: Read-only Model Context Protocol (MCP) server for inspecting live Levit scopes, reactive state graphs, task trees, and runtime diagnostics.
version: 0.1.0
repository: https://github.com/softilab/levit
homepage: https://github.com/softilab/levit
topics:
  - levit
  - mcp
  - diagnostics
  - state-management
  - reactive

environment:
  sdk: ^3.7.0

dependencies:
  args: ^2.7.0
  dart_mcp: ^0.5.2
  levit_monitor: ^0.1.0
  stream_channel: ^2.1.4

dev_dependencies:
  lints: '>=5.1.1 <7.0.0'
  test: ^1.25.6

executables:
  levit_mcp: levit_mcp
