name: Publish Dry Run

on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Levit
        uses: ./.github/actions/setup-levit
        with:
          pub-cache-suffix: ${{ hashFiles('**/pubspec.yaml', 'melos.yaml') }}

      - name: Publish dry-run
        run: dart run scripts/publish_dry_run.dart --quiet
