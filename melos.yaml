name: levit
repository: https://github.com/softilab/levit

packages:
  - benchmarks
  - examples/**
  - packages/**
  - stress_tests

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  ci:
    run: dart run scripts/ci.dart
    description: Run analysis and test checks

  analyze:
    run: dart analyze --fatal-infos
    description: Run static analysis
    exec:
      concurrency: 6

  test:
    run: dart test
    description: Run pure Dart tests
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
      noDependsOn: flutter
      ignore:
        - levit_stress_tests
        - dev_tool_server

  test:flutter:
    run: flutter test
    description: Run Flutter tests
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
      dependsOn: flutter
      ignore:
        - levit_stress_tests
        - benchmarks
        - flutter_dev_tool

  test:browser:
    run: dart run scripts/check_browser_builds.dart
    description: Compile browser runtime contracts, examples and bundled inspector

  test:lints:
    run: dart run scripts/check_lint_plugin.dart
    description: Verify native analyzer plugin in a real local consumer

  coverage:
    run: dart run scripts/check_coverage.dart --fail-under=100
    description: Run coverage checks

  publish:dry-run:
    run: dart run scripts/publish_dry_run.dart
    description: Validate publishable packages without publishing

  stress:
    run: dart run scripts/stress_test.dart
    description: Run stress tests

  benchmarks:
    run: flutter test
    description: Run benchmark harness tests
    exec:
      concurrency: 1
    packageFilters:
      scope: benchmarks

  report:benchmarks:
    run: flutter test tool/generate_benchmark_report.dart --reporter=compact
    description: Regenerate benchmark report
    exec:
      concurrency: 1
    packageFilters:
      scope: benchmarks

  format:
    run: dart format .
    description: Format all Dart code
    exec:
      concurrency: 6

  # 1. Generate docs for every package
  doc:gen:
    run: dart doc --output=../../../.temp-docs .
    exec:
      # Run this in every package that has a pubspec.yaml and isn't an example
      concurrency: 1
      failFast: true
    packageFilters:
      scope:
        - levit_flutter
