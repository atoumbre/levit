name: levit
repository: https://github.com/softilab/levit

packages:
  - benchmarks
  - examples/**
  - packages/**
  - stress_tests

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  ci:
    run: dart run scripts/ci.dart
    description: Run analysis and test checks

  analyze:
    run: dart analyze --fatal-infos
    description: Run static analysis
    exec:
      concurrency: 6

  test:
    run: dart test
    description: Run pure Dart tests
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
      noDependsOn: flutter
      ignore:
        - levit_stress_tests

  test:flutter:
    run: flutter test
    description: Run Flutter tests
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
      dependsOn: flutter
      ignore:
        - levit_stress_tests
        - benchmarks

  test:browser:
    run: dart run scripts/check_browser_builds.dart
    description: Compile browser runtime contracts and web examples

  test:lints:
    run: dart run scripts/check_lint_plugin.dart
    description: Verify native analyzer plugin in a real local consumer

  coverage:
    run: dart run scripts/check_coverage.dart --fail-under=100
    description: Run coverage checks

  publish:dry-run:
    run: dart run scripts/publish_dry_run.dart
    description: Validate publishable packages without publishing

  stress:
    run: dart run scripts/stress_test.dart
    description: Run stress tests

  benchmarks:
    run: flutter test
    description: Run benchmark harness tests
    exec:
      concurrency: 1
    packageFilters:
      scope: benchmarks

  report:benchmarks:
    run: flutter test tool/generate_benchmark_report.dart --reporter=compact
    description: Regenerate benchmark report
    exec:
      concurrency: 1
    packageFilters:
      scope: benchmarks

  format:
    run: dart format .
    description: Format all Dart code
    exec:
      concurrency: 6

  # Validate DartDoc generation and link integrity across core, kit, and tool packages
  doc:check:
    run: dart run scripts/check_docs.dart
    description: Validate DartDoc generation and links across core, kit, and tool packages

  # Generate docs for core, kit, and tool packages
  doc:gen:
    run: dart doc --validate-links --output=../../../.temp-docs/MELOS_PACKAGE_NAME .
    exec:
      concurrency: 1
      failFast: true
    packageFilters:
      scope:
        - levit_reactive
        - levit_scope
        - levit_dart_core
        - levit_flutter_core
        - levit_monitor
        - levit_dart
        - levit
        - levit_flutter
        - levit_lints
        - levit_mcp
